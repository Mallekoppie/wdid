syntax = "proto3";

package wdid.v1;

import "check_ins.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Mallekoppie/wdid/internal/gen/wdid/v1;wdidv1";

// ReviewCadence controls the personal-review prompt.
enum ReviewCadence {
  REVIEW_CADENCE_UNSPECIFIED = 0;
  REVIEW_CADENCE_WEEKLY = 1;
  REVIEW_CADENCE_MONTHLY = 2;
  REVIEW_CADENCE_OFF = 3;
}

// ThemePreference is the user's colour scheme preference.
enum ThemePreference {
  THEME_PREFERENCE_UNSPECIFIED = 0;
  THEME_PREFERENCE_SYSTEM = 1;
  THEME_PREFERENCE_LIGHT = 2;
  THEME_PREFERENCE_DARK = 3;
  THEME_PREFERENCE_HIGH_CONTRAST = 4;
}

// DensityPreference is the user's row-density preference.
enum DensityPreference {
  DENSITY_PREFERENCE_UNSPECIFIED = 0;
  DENSITY_PREFERENCE_COMFORTABLE = 1;
  DENSITY_PREFERENCE_COMPACT = 2;
}

// Settings is the single per-user behaviour and appearance record. The AI
// provider key is stored in the same per-user record but never appears in this
// message; only has_ai_api_key reports whether one is stored.
message Settings {
  string timezone = 1;
  // 1 is Monday and 7 is Sunday, matching the ISO week number.
  int32 week_start = 2;
  google.protobuf.Duration daily_target = 3;
  ReviewCadence review_cadence = 4;
  google.protobuf.Duration long_timer_threshold = 5;
  google.protobuf.Duration default_entry_duration = 6;
  string backup_directory = 7;
  google.protobuf.Duration backup_interval = 8;
  int32 backup_retention = 9;
  string ai_base_url = 10;
  string ai_model = 11;
  bool ai_redact = 12;
  ThemePreference theme = 13;
  DensityPreference density = 14;
  string journal_start_date = 15;
  google.protobuf.Timestamp updated_at = 16;
  // The per-user roster of support-person names offered by the client. A
  // person is a name on a work entry, not an entity: this list never rewrites
  // historical entries.
  repeated string support_people = 17;
  // Whether the account has an AI provider key stored. The key itself is
  // write-only: it is never returned by any RPC or export.
  bool has_ai_api_key = 18;
}

// PromptTemplate is one check-in instruction variant as the caller currently
// sees it. Body is the current instruction body (the caller's override when
// customised, otherwise the built-in body) without the locked rules. Rules are
// server-owned, identical for every variant, always appended to the resolved
// instruction, and can never be edited, omitted or reordered.
message PromptTemplate {
  CheckInPromptVariant variant = 1;
  string body = 2;
  bool customised = 3;
  string rules = 4;
}

message ListPromptTemplatesRequest {}

message ListPromptTemplatesResponse {
  // One entry per known variant, in variant order.
  repeated PromptTemplate templates = 1;
}

// UpdatePromptTemplate replaces the caller's instruction body for one variant.
// A blank body is rejected: use ResetPromptTemplate to restore the built-in.
message UpdatePromptTemplateRequest {
  CheckInPromptVariant variant = 1;
  string body = 2;
}

message UpdatePromptTemplateResponse {
  PromptTemplate template = 1;
}

// ResetPromptTemplate removes the caller's override for one variant, so the
// built-in body applies again.
message ResetPromptTemplateRequest {
  CheckInPromptVariant variant = 1;
}

message ResetPromptTemplateResponse {
  PromptTemplate template = 1;
}

// About describes the running build and database schema.
message About {
  string version = 1;
  int32 schema_version = 2;
  string license = 3;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
  About about = 2;
}

// UpdateSettings replaces the user's settings. Every preference is sent, so a
// zero or unspecified enum value is rejected rather than silently ignored.
message UpdateSettingsRequest {
  Settings settings = 1;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}

// SetAIApiKey stores or replaces the caller's own AI provider key. The key is
// write-only: it is never returned in the response or by GetSettings.
message SetAIApiKeyRequest {
  string api_key = 1;
}

message SetAIApiKeyResponse {
  Settings settings = 1;
}

// ClearAIApiKey removes the stored key, which disables AI generation until a
// new key is set.
message ClearAIApiKeyRequest {}

message ClearAIApiKeyResponse {
  Settings settings = 1;
}

// Backup describes one database snapshot on disk.
message Backup {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  int64 size_bytes = 3;
  // Manual backups are never deleted by retention.
  bool manual = 4;
}

// BackupStatus is the instance-wide backup state shown in Settings. A
// workspace with no scheduled snapshot yet reports overdue.
message BackupStatus {
  google.protobuf.Timestamp last_backup_at = 1;
  int64 last_backup_size_bytes = 2;
  bool overdue = 3;
  string backup_directory = 4;
  google.protobuf.Duration backup_interval = 5;
  int32 backup_retention = 6;
  int32 scheduled_count = 7;
  int32 manual_count = 8;
  google.protobuf.Timestamp next_backup_at = 9;
  bool last_backup_manual = 10;
}

message BackupNowRequest {}

message BackupNowResponse {
  Backup backup = 1;
  BackupStatus status = 2;
}

message GetBackupStatusRequest {}

message GetBackupStatusResponse {
  BackupStatus status = 1;
}

message ListBackupsRequest {}

message ListBackupsResponse {
  repeated Backup backups = 1;
}

// RestoreBackup replaces the live database with one verified snapshot. The
// current database is copied aside first; the service reopens the store and
// rebuilds its indexes before reporting success.
message RestoreBackupRequest {
  // The snapshot name as returned by ListBackups.
  string name = 1;
}

message RestoreBackupResponse {
  Backup backup = 1;
  BackupStatus status = 2;
  // The file holding the database as it was before this restore.
  string pre_restore_path = 3;
}

// SettingsService owns per-user behaviour and appearance plus instance-wide
// backups. Every RPC requires a bearer token; the account is derived from that
// token. Snapshots cover every account, so backups are admin-only: the backup
// RPCs (including RestoreBackup) require the admin role, and UpdateSettings
// rejects backup directory, interval and retention changes from any other
// account with PERMISSION_DENIED.
service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // The AI key is write-only: these RPCs set/replace or clear it. Every other
  // response only reports has_ai_api_key.
  rpc SetAIApiKey(SetAIApiKeyRequest) returns (SetAIApiKeyResponse);
  rpc ClearAIApiKey(ClearAIApiKeyRequest) returns (ClearAIApiKeyResponse);
  // Prompt templates are per-account instruction bodies. The server always
  // appends the locked rules, so a custom body can never remove them.
  rpc ListPromptTemplates(ListPromptTemplatesRequest) returns (ListPromptTemplatesResponse);
  rpc UpdatePromptTemplate(UpdatePromptTemplateRequest) returns (UpdatePromptTemplateResponse);
  rpc ResetPromptTemplate(ResetPromptTemplateRequest) returns (ResetPromptTemplateResponse);
  rpc BackupNow(BackupNowRequest) returns (BackupNowResponse);
  rpc GetBackupStatus(GetBackupStatusRequest) returns (GetBackupStatusResponse);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
}
